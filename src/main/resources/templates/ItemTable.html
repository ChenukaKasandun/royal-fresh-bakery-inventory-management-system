<!DOCTYPE html>
<html lang="en">


<!-- Requesting header area from common header page -> header.html using ThymeLeaf Function -->

<head th:replace="header :: headerFragment"></head>

<!-- This is a unique element in head area -->

<head>
  <!-- link external css file -->
  <link rel="stylesheet" href="/css/item.css">

</head>

<body>

  <!-- nav bar -->
  <nav th:replace="topnavbar :: topNavbarFragment"></nav>

  <div class="container-fluid">
    <div class="row mt-2 mb-3"></div>
    <div class="row mt-2 mb-5">
      <div class="col-3"></div>
      <div class=" col-6 text-center fw-bold title text-light">
        <h4><i class="fa-solid fa-hotdog"></i> Item Table</h4>
      </div>
      <div class="col-3"></div>

    </div>


    <div class="row mt-2 text-center ">

      <div class="col-1"></div>
      <div class="col-10">

        <div class="card card-body" style="background-color: lavender; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.596);">
          <div class="row mt-2 mb-3">
            <h5><i class="fa-solid fa-table"></i> <b>Item Table</b></h>
          </div>
          <div class="row mt-2 mb-3">
            <table class="table table-hover" id="itemTable">
              <thead class="table-dark">
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Item Code</th>
                  <th scope="col">Item Name</th>
                  <th scope="col">Item Status</th>
                  <th scope="col">Item Category</th>
                  <th scope="col">Modify</th>

                </tr>
              </thead>
              <tbody id="itemTableBody" class="text-start">


                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>




              </tbody>
            </table>

          </div>
        </div>



      </div>
      <div class="col-1"></div>









    </div>













  </div>



  <!-- model view/print -->
  <div class="modal " id="modalItemView" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalItemView">Print Item Table</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">

          <div class="card">
            <div class="card-body form-area">
              <table class="table table-hover table-striped" id="tableItemView">

                <tr>
                  <th>Item Code </th>
                  <td id="tdItemCode"></td>
                </tr>

                <tr>
                  <th>Item Name </th>
                  <td id="tdItemName"></td>
                </tr>
                <tr>
                  <th>Item Status</th>
                  <td id="tdItemStatus"></td>
                </tr>
                <tr>
                  <th>Item Category </th>
                  <td id="tdItemCategory"></td>
                </tr>
                <tr>
                  <th>Profit Rate</th>
                  <td id="tdProfitRate"></td>
                </tr>


              </table>

            </div>
          </div>
        </div>

        <div class="modal-footer">

          <button type="button" class="btn btn-primary" onclick="printRawMaterialRow()">Print</button>
        </div>
      </div>
    </div>
  </div>


  <script src="/script/commonFunctions.js"></script>
  <script src="/script/commonValidationFunctions.js"></script>
  <script src="/uicontroller/itemTable.js"></script>

</body>

</html>
