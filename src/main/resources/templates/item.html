<!DOCTYPE html>
<html lang="en">


<!-- Requesting header area from common header page -> header.html using ThymeLeaf Function -->

<head th:replace="header :: headerFragment"></head>

<!-- This is a unique element in head area -->

<head>
    <!-- link external css file -->
    <link rel="stylesheet" href="/css/item.css">

</head>

<body>

    <!-- nav bar -->
    <nav th:replace="topnavbar :: topNavbarFragment"></nav>


        <div class="row mt-2 mb-3"></div>
        <!-- Title Row -->
        <div class="row mt-2 mb-3">
            <div class="col-3"></div>
            <div class=" col-6 text-center fw-bold title text-light"
                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                <h4><i class="fa-solid fa-hotdog"></i> Item Management</h4>
            </div>
            <div class="col-3"></div>
        </div>

        <div class="row mt-2">
            <div class="col-8"></div>

            <!-- Button trigger modal -->
            <button type="button" style="height: 30px;  box-shadow: 0px 4px 6px rgba(0, 0,
                0, 0.901);" class="btn btn-dark col-3" data-bs-toggle="modal" data-bs-target="#modalItemForm">
                <h6><i class="fa-solid fa-plus"></i>
                    <b>Add Item</b>
                </h6>
            </button>

            <!-- Modal -->
            <div class="modal fade modal-xl" id="modalItemForm" data-bs-backdrop="static" data-bs-keyboard="false"
                 tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body"
                             style="background-image:url('/images/newwww.jpg');  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">

                            <!-- Form Row -->
                            <div class="row">

                                <div class="col-6">

                                    <form onsubmit="return false " id="itemForm">
                                                <div class="row mt-2 mb-3">

                                                    <div class="col">
                                                        <label for="selectItemCategoryType" class="form-label"><b>Item
                                                            Category
                                                            :<span class="text-danger">*</span></b></label>
                                                        <select class="form-select" id="selectItemCategoryType"
                                                                onchange=" dyanamicElementValidator(this,'item','item_category_id');"></select>
                                                    </div>

                                                    <div class="col">
                                                        <div class="mb-3">
                                                            <label for="txtItemName" class="form-label"><b>Item
                                                                Name:<span class="text-danger">*</span></b></label>
                                                            <input type="text" class="form-control" id="txtItemName"
                                                                   onkeyup="textValidator(this,'^([A-Z][a-z]{1,20})([ ][A-Z][a-z]{1,20})*$','item','item_name')"
                                                                   placeholder="Enter Item Name"
                                                            >
                                                        </div>
                                                    </div>

                                                </div>


                                                <div class="row mt-2 mb-3">
                                                    <div class="col-6">
                                                        <label for="selectItemStatus" class="form-label"><b>Item
                                                            Status:<span class="text-danger">*</span></b></label>
                                                        <select class="form-select" id="selectItemStatus"
                                                                onchange=" dyanamicElementValidator(this,'item','item_status_id');"></select>
                                                    </div>

                                                    <div class="col-6">
                                                        <label for="selectItemReturningState" class="form-label"><b>Item Returning State:
                                                            <span class="text-danger">*</span></b></label>
                                                        <select class="form-select" id="selectItemReturningState"
                                                                onchange=" dyanamicElementValidator(this,'item','item_return_status_id');"></select>
                                                    </div>

                                                </div>

                                        <div class="row">
                                            <div class="col-6">
                                                <label for="textNote" class="form-label fw-bold">Note
                                                    :</label>
                                                <textarea class="form-control" id="textNote" rows="2"></textarea>
                                            </div>
                                        </div>

                                    </form>

                                </div>

                                <div class="col-6">

                                    <div class="card"  style="background-image:url('/images/newwww.jpg');  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                                        <div class="card-body">
                                            <!--Material inner Form and Inner Table-->
                                            <div class="row">
                                                <div class="  text-center fw-bold title text-light"
                                                     style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);background-color: #997645">
                                                    <h5>Material Form</h5>
                                                </div>

                                             <hr>
                                            </div>

                                            <form id="materialInnerForm">

                                                <div class="row mt-2 mb-3">
                                                    <div class="col">
                                                        <label for="selectMaterialName" class="form-label"><b>Material Name
                                                            :<span class="text-danger">*</span></b></label>
                                                        <select class="form-select" id="selectMaterialName"
                                                                onchange=" dyanamicElementValidator2(this,'itemHasMaterial','material_id');"></select>
                                                    </div>

                                                    <div class="col">
                                                        <label for="txtQty"
                                                               class="form-label"><b>Quantity:<span
                                                                class="text-danger">*</span></b></label>
                                                        <input type="text" class="form-control"
                                                               id="txtQty"
                                                               onkeyup="textValidator(this,'^(([0-9]{1,100})|([0-9]{1,100}[.][0-9]{2}))$','itemHasMaterial','qty')"
                                                               placeholder="Ex: Enter Item Quantity"
                                                        >
                                                        <div class="valid-feedback">
                                                            Looks good!
                                                        </div>
                                                        <div class="invalid-feedback">
                                                            Looks not good!
                                                        </div>
                                                    </div>


                                                </div>
                                                    <br>

                                            </form>
                                            <!--                                                Inner Buttons-->

                                            <div class="row mt-2">

                                                <div class="col-3 text-start">
                                                </div>
                                                <div class="col-9 text-end">
                                                    <button type="reset" class="btn btn-info"
                                                            style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">Clear</button>

                                                    <button type="submit" class="btn btn-success"
                                                            onclick="buttonInnerFormSubmit()"
                                                            style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"><i
                                                            class="fa-solid fa-plus" ></i>Add</button>
                                                </div>
                                            </div>

                                            <hr><hr>


                                            <div class="row mt-2 mb-3">
                                                <div class="  text-center fw-bold title text-light"
                                                     style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);background-color: #997645">
                                                    <h5>Material Table</h5>
                                                </div>
                                            </div>
                                            <div class="row mt-2 mb-3">
                                                <table class="table table-hover" id="itemInnerTable">
                                                    <thead class="table-light">
                                                    <tr>
                                                        <th scope="col">#</th>
                                                        <th scope="col">Material</th>
                                                        <th scope="col">Quantity</th>
                                                        <th scope="col">Modify</th>

                                                    </tr>
                                                    </thead>
                                                    <tbody id="tableInnerItemBody" style="background-color: white">

                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>


                                                    </tbody>
                                                </table>

                                            </div>

                                        </div>
                                    </div>


                                </div>
                            </div>


                            <!--Button Row-->
                            <div class="row">
                                <div class="text-end" id="buttonContainer">
                                    <button type="reset" class="btn btn-info me-2"
                                            style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                                            onclick="refreshForm()">Clear</button>

                                    <button type="submit" class="btn btn-warning me-2" onclick="buttonItemUpdate()"
                                            id="buttonUpdate" form="itemForm"
                                            style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">Update</button>

                                    <button type="submit" class="btn btn-success  me-2" onclick="buttonItemSubmit()"
                                            style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);" id="buttonSubmit"
                                            form="itemForm"><i class="fa-solid fa-plus"></i>Add</button>
                                </div>
                            </div>


                            </div>

                        </div>


                    </div>

                </div>
            </div>

            <!-- model view/print -->
            <div class="modal " id="modalItemView" data-bs-backdrop="static" data-bs-keyboard="false"
                 tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header">
                            <div class="w-100 text-center">
                                <h5 class="modal-title" id="modalItemViewHeader">Item View</h5>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">

                            <div class="card">
                                <div class="card-body form-area">
                                    <table class="table table-hover table-striped" id="tableItemView">


                                        <tr>
                                            <th>Item Code </th>
                                            <td id="tdItemCode"></td>

                                        </tr>
                                        <tr>
                                            <th>Item Category</th>
                                            <td id="tdItemCategory"></td>
                                        </tr>
                                        <tr>
                                            <th>Item Name</th>
                                            <td id="tdItemName"></td>
                                        </tr>

                                        <tr>
                                            <th>Item Status</th>
                                            <td id="tdItemStatus"></td>
                                        </tr>

                                        <tr>
                                            <th>Item Status</th>
                                            <td id="tdItemReturningStatus"></td>
                                        </tr>

                                    </table>

                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">

                            <button type="button" class="btn btn-primary" onclick="printItemRow()">Print</button>
                        </div>
                    </div>
                </div>
            </div>

<!----------------Start of Item Table------------------------->
                <div class="row mt-2 text-center ">

                    <div class="col-1"></div>
                    <div class="col-10">

                        <div class="card card-body" style="background-color: lavender; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.596);">
                            <div class="row mt-2 mb-3">
                                <h5><i class="fa-solid fa-table"></i> <b>Item Table</b></h5>
                            </div>
                            <div class="row mt-2 mb-3">
                                <table class="table table-hover" id="itemTable">
                                    <thead class="table-dark">
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Item Code</th>
                                        <th scope="col">Item Category</th>
                                        <th scope="col">Item Name</th>
                                        <th scope="col">Item Status</th>
                                        <th scope="col">Item Returning Status</th>

                                        <th scope="col">Modify</th>

                                    </tr>
                                    </thead>
                                    <tbody id="itemTableBody" class="text-start">

                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>

                                    </tbody>

                                </table>

                            </div>
                        </div>

                    </div>
                    <div class="col-1"></div>
                </div>

<!------------------------End of Item Table------------------>
            </div>
        </div>


        <script src="/script/commonFunctions.js"></script>
        <script src="/script/commonValidationFunctions.js"></script>
        <script src="/uicontroller/item.js"></script>

</body>

</html>
