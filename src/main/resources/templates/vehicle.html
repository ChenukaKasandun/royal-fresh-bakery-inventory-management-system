<!DOCTYPE html>
<html lang="en">
<!-- Requesting header area from common header page -> header.html using ThymeLeaf Function -->

<head th:replace="header :: headerFragment"></head>

<!-- This is a unique element in head area -->

<head>
    <!-- link external css file -->
    <link rel="stylesheet" href="/css/vehicle.css">

</head>

<body>

    <!-- nav bar -->
    <nav th:replace="topnavbar :: topNavbarFragment"></nav>

    <div class="container-fluid">
        <div class="row mt-2 mb-3"></div>
        <div class="row mt-2 mb-5">
            <div class="col-3"></div>
            <div class=" col-6 text-center fw-bold title text-light"
                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                <h4><i class="fa-regular fa-file"></i> Vehicle Management</h4>
            </div>
            <div class="col-3"></div>

        </div>




        <div class="row mt-2">
            <div class="col-8"></div>

            <!-- Button trigger modal -->
            <button type="button" style="height: 30px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                class="btn btn-dark col-3" data-bs-toggle="modal" data-bs-target="#modalVehicleForm">
                <h6><i class="fa-solid fa-plus"></i>
                    <b>Add a Vehicle</b>
                </h6>
            </button>

            <!-- Modal -->
            <div class="modal fade modal-xl" id="modalVehicleForm" data-bs-backdrop="static" data-bs-keyboard="false"
                tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body"
                             style="background-image:url('/images/newwww.jpg');  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                            <form onsubmit=" return false " id="vehicleForm">
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label for="txtVehicleName" class="form-label"><b>Vehicle Name:<span
                                                        class="text-danger">*</span></b></label>
                                            <input type="text" class="form-control" id="txtVehicleName"
                                                onkeyup="vehicle.name = this.value">
                                        </div>

                                    </div>

                                    <div class="col">
                                        <label for="selectVehicleType" class="form-label"><b>Vehicle Type:<span
                                                    class="text-danger">*</span></b></label>
                                        <select class="form-select" id="selectVehicleType" required
                                            onchange="dynamicElementValidator(this,'vehicle','vehicle_type_id');"></select>
                                    </div>



                                </div>

                                <div class="row mt-2 mb-3">
                                    <div class="col">
                                        <div class="mb-3">
                                            <label for="txtVehiclePlateNo" class="form-label"><b>Number Plate No:<span
                                                        class="text-danger">*</span></b></label>
                                            <input type="text" class="form-control" id="txtVehiclePlateNo"
                                                onkeyup="vehicle.number_plate_no = this.value">
                                        </div>

                                    </div>

                                    <div class="col">
                                        <div class="mb-3">
                                            <label for="txtVehicleModel" class="form-label"><b>Vehicle Model:<span
                                                        class="text-danger">*</span></b></label>
                                            <input type="text" class="form-control" id="txtVehicleModel"
                                                onkeyup="vehicle.model = this.value">
                                        </div>

                                    </div>



                                </div>


                                <div class="row mt-2 mb-3">

                                    <div class="col-6">
                                        <label for="selectVehicleStatus" class="form-label"><b>Vehicle Status:<span
                                                    class="text-danger">*</span></b></label>
                                        <select class="form-select" id="selectVehicleStatus" required
                                            onchange="dynamicElementValidator(this,'vehicle','vehicle_status_id');"></select>
                                    </div>

                                    <div class="col">
                                        <label for="selectDriverName" class="form-label"><b>Driver Name :<span
                                                    class="text-danger">*</span></b></label>
                                        <select class="form-select" id="selectDriverName" required
                                            onchange="dynamicElementValidator(this,'vehicle','employee_id');"></select>
                                    </div>

                                </div>

                                <div class="row">

                                    <diiv class="col">
                                        <label class="form-label"><b>Vehicle Route:<span
                                                    class="text-danger">*</span></b></label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="checkbox" id="checkRouteA"
                                                onchange="checkBoxValidator()" value="routeA">
                                            <label class="form-check-label" for="checkRouteA">Route A</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="checkbox" id="checkRouteB"
                                                onchange="checkBoxValidator()" value="routeB">
                                            <label class="form-check-label" for="checkRouteB">Route B</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="checkbox" id="checkRouteC"
                                                onchange="checkBoxValidator()" value="routeC">
                                            <label class="form-check-label" for="checkRouteC">Route C</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="checkbox" id="checkRouteD"
                                                onchange="checkBoxValidator()" value="routeD">
                                            <label class="form-check-label" for="checkRouteD">Route D</label>
                                        </div>

                                    </diiv>

                                </div>

                                <div class="row mb-3">

                                    <label for="textNote" class="form-label fw-bold">Note :</label>
                                    <textarea class="form-control " id="textNote" rows="3"></textarea>

                                </div>

                                <!--                            Buttons-->
                                <div class="row mt-2">
                                    <div class="text-end" id="buttonContainer">
                                        <button type="reset" class="btn btn-info me-2"
                                                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">Clear</button>
                                        <button type="submit" class="btn btn-warning me-2"
                                                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                                                id="buttonUpdate" onclick=" buttonVehicleUpdate()">Update</button>

                                        <button type="submit" class="btn btn-success"
                                                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                                                id="buttonSubmit" onclick=" buttonVehicleSubmit()"><i
                                                class="fa-solid fa-plus"></i>Add</button>
                                    </div>
                                </div>


                            </form>


                        </div>


                    </div>

                </div>
            </div>

            <!-- model view/print -->
            <div class="modal " id="modalVehicleView" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalVehicleView">Print Vehicle Table</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">

                            <div class="card">
                                <div class="card-body form-area">
                                    <table class="table table-hover table-striped" id="tableVehicleView">


                                        <tr>
                                            <th>Vehicle Name</th>
                                            <td id="tdVehicleName"></td>

                                        </tr>
                                        <tr>
                                            <th>Vehicle Type</th>
                                            <td id="tdVehicleType"></td>
                                        </tr>
                                        <tr>
                                            <th>Number Plate No</th>
                                            <td id="tdNoPlateNo"></td>
                                        </tr>

                                        <tr>
                                            <th>Model</th>
                                            <td id="tdModel"></td>
                                        </tr>
                                        <tr>
                                            <th>Status</th>
                                            <td id="tdStatus"></td>
                                        </tr>
                                        <tr>
                                            <th>Driver Name</th>
                                            <td id="tdDriverName"></td>
                                        </tr>


                                    </table>

                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">

                            <button type="button" class="btn btn-primary" onclick="printVehicleRow()">Print</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>




    </div>



    <!-- Purchase Order Table -->
    <div class="row mt-2 text-center ">

        <div class="col-1"></div>
        <div class="col-10">

            <div class="card card-body"
                style="background-color: lavender; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.596);">
                <div class="row mt-2 mb-3">
                    <h5><i class="fa-solid fa-table"></i> <b>Vehicle Table</b></h5>
                </div>
                <div class="row mt-2 mb-3">
                    <table class="table table-hover" id="vehicleTable">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Vehicle Name</th>
                                <th scope="col">Vehiclle Type</th>
                                <th scope="col">Number Plate</th>
                                <th scope="col">Model</th>
                                <th scope="col">Status</th>
                                <th scope="col">Driver Name</th>
                                <th scope="col">Modify</th>

                            </tr>
                        </thead>
                        <tbody id="vehicleTableBody">



                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>

                        </tbody>
                    </table>

                </div>
            </div>



        </div>
        <div class="col-1"></div>









    </div>











    </div>

    <script src="/script/commonFunctions.js"></script>
    <script src="/uicontroller/vehicle.js"></script>

</body>

</html>
