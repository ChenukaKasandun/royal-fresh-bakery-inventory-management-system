<!DOCTYPE html>
<html lang="en">


<!-- Requesting header area from common header page -> header.html using ThymeLeaf Function -->

<head th:replace="header :: headerFragment"></head>

<!-- This is a unique element in head area -->

<head>
    <!-- link external css file -->
    <link rel="stylesheet" href="/css/delivery.css">

</head>

<body>

    <!-- nav bar -->
    <nav th:replace="topnavbar :: topNavbarFragment"></nav>

    <div class="container-fluid">
        <div class="row mt-2 mb-3"></div>
        <div class="row mt-2 mb-5">
            <div class="col-3"></div>
            <div class=" col-6 text-center fw-bold title text-light"
                style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                <h4><i class="fa-solid fa-truck-droplet"></i>Delivery Management</h4>
            </div>
            <div class="col-3"></div>

        </div>




        <div class="row mt-2">
            <div class="col-8"></div>

            <!-- Button trigger modal -->
            <button type="button" class="btn btn-dark col-3"
                style="height: 30px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);" data-bs-toggle="modal"
                data-bs-target="#modalDeliveryForm">
                <h6><i class="fa-solid fa-plus"></i>
                    <b>New Delivery</b>
                </h6>
            </button>

            <!-- Modal -->
            <div class="modal fade modal-xl" id="modalDeliveryForm" data-bs-backdrop="static" data-bs-keyboard="false"
                tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body"
                            style="background-color: darkgrey;  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">

                            <div class="card">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <div class="card"
                                                style="background-color: darkgrey;  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                                                <div class="card-body">
                                                    <form onsubmit="return false " id="deliveryForm">
                                                        <div class="row">

                                                            <div class="col">
                                                                <div class="col">
                                                                    <label for="selectCustomerName"
                                                                        class="form-label"><b>Customer Name:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <select class="form-select" id="selectCustomerName"
                                                                        onchange=" dynamicElementValidator(this,'delivery','customer_id');"
                                                                        required></select>
                                                                </div>

                                                            </div>
                                                            <div class="col">
                                                                <div class="col">
                                                                    <label for="selectInvoiceNo"
                                                                        class="form-label"><b>Invoice No:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <select class="form-select" id="selectInvoiceNo"
                                                                        onchange=" dynamicElementValidator(this,'delivery','invoice_id');"
                                                                        required></select>
                                                                </div>

                                                            </div>

                                                        </div>

                                                        <div class="row">
                                                            <div class="col">
                                                                <div class="col">
                                                                    <label for="selectOrderNo"
                                                                        class="form-label"><b>Order No:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <select class="form-select" id="selectOrderNo"
                                                                        onchange=" dynamicElementValidator(this,'delivery','customer_order_id');"
                                                                        required></select>
                                                                </div>

                                                            </div>

                                                            <div class="col">
                                                                <div class="mb-3">
                                                                    <label for="txtDeliveryDate"
                                                                        class="form-label"><b>Delivery date:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <input type="date" class="form-control"
                                                                        onkeydown="return false" id="txtDeliveryDate"
                                                                        onchange="delivery.delivery_date = this.value">
                                                                </div>
                                                            </div>



                                                        </div>

                                                        <div class="row mt-2 mb-3">


                                                            <div class="col">
                                                                <div class="mb-3">
                                                                    <label for="txtDeliveryTime"
                                                                        class="form-label"><b>Delivery Time:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <input type="time" class="form-control"
                                                                        onchange="delivery.delivery_time = this.value"
                                                                        placeholder="Enter  Delivery Time...!"
                                                                        id="txtDeliveryTime">
                                                                </div>
                                                            </div>

                                                            <div class="col">
                                                                <div class="mb-3">
                                                                    <label for="txtDeliveryAddress"
                                                                        class="form-label"><b>Delivery Address:<span
                                                                                class="text-danger">*</span></b></label>
                                                                    <input type="text" class="form-control"
                                                                        onkeyup="delivery.delivery_address =  this.value"
                                                                        placeholder="Enter Delivery Address...!"
                                                                        id="txtDeliveryAddress">
                                                                </div>
                                                            </div>

                                                        </div>
                                                        <div class="row mt-2 mb-3">

                                                            <div class="col">
                                                                <label for="selectDeliveryRoute"
                                                                    class="form-label"><b>Delivery Vehicle :<span
                                                                            class="text-danger">*</span></b></label>
                                                                <select class="form-select" id="selectDeliveryVehicle"
                                                                    onchange=" dynamicElementValidator(this,'delivery','vehicle_id');"
                                                                    required></select>
                                                            </div>


                                                            <div class="col">
                                                                <label for="selectDeliveryStatus"
                                                                    class="form-label"><b>Delivery Status :<span
                                                                            class="text-danger">*</span></b></label>
                                                                <select class="form-select" id="selectDeliveryStatus"
                                                                    onchange=" dynamicElementValidator(this,'delivery','delivery_status_id');"
                                                                    required></select>
                                                            </div>


                                                        </div>

                                                        <div class="row mt-2 mb-3">



                                                            <div class="col">
                                                                <label for="textNote" class="form-label fw-bold">Note
                                                                    :</label>
                                                                <textarea class="form-control" id="textNote"
                                                                    rows="2"></textarea>



                                                            </div>



                                                        </div>







                                                    </form>


                                                </div>
                                            </div>
                                        </div>

                                        <div class="col">

                                            <div class="card"
                                                style="background-color: darkgrey;  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
                                                <div class="card-body">
                                                    <div class="row mt-2 text-center ">

                                                        <div class="row mt-2 mb-3">
                                                            <h6> <b>Delivery Inner Table</b></h6>
                                                        </div>


                                                        <div class="row mt-2 mb-3">
                                                            <table class="table table-hover " id="itemInnerTable">
                                                                <thead>
                                                                    <tr>
                                                                        <th scope="col">#</th>
                                                                        <th scope="col">Item Name</th>
                                                                        <th scope="col">Quantity</th>
                                                                        <th scope="col">Modify</th>

                                                                    </tr>
                                                                </thead>
                                                                <tbody id="itemInnerTableBody">


                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>
                                                                    <td></td>

                                                                </tbody>
                                                            </table>

                                                        </div>





                                                        <div class="col-1"></div>









                                                    </div>

                                                </div>
                                            </div>


                                        </div>


                                        <div class="row mt-2">

                                            <div class="col-3 text-start">
                                                <button type="reset" class="btn btn-info">Clear</button>


                                            </div>
                                            <div class="col-9 text-end" id="buttonContainer">
                                                <button type="submit" class="btn btn-warning me-2"
                                                    style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                                                    id="buttonUpdate" onclick=" buttonDeliveryUpdate()">Update</button>

                                                <button type="submit" class="btn btn-success"
                                                    style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);"
                                                    id="buttonSubmit" onclick=" buttonDeliverySubmit()"><i
                                                        class="fa-solid fa-plus"></i>Add</button>

                                            </div>


                                        </div>

                                    </div>

                                </div>
                            </div>


                        </div>


                    </div>

                </div>
            </div>

            <!-- model view/print -->
            <div class="modal " id="modalDeliveryView" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalDeliveryView">Print Delivery Table</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body">

                            <div class="card">
                                <div class="card-body form-area">
                                    <table class="table table-hover table-striped" id="tablelDeliveryView">


                                        <tr>
                                            <th>Delivery No </th>
                                            <td id="tdDeliveryNo"></td>

                                        </tr>
                                        <tr>
                                            <th>Invoice No</th>
                                            <td id="tdInvoiceNo"></td>
                                        </tr>
                                        <tr>
                                            <th>Customer Name</th>
                                            <td id="tdCustomerName"></td>
                                        </tr>

                                        <tr>
                                            <th>Delivery Date</th>
                                            <td id="tdDeliveryDate"></td>
                                        </tr>
                                        <tr>
                                            <th>Delivery Address</th>
                                            <td id="tdAddress"></td>
                                        </tr>
                                        <tr>
                                            <th>Delivery Status</th>
                                            <td id="tdDeliveryStatus"></td>
                                        </tr>


                                    </table>

                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">

                            <button type="button" class="btn btn-primary" onclick="printDeliveryRow()">Print</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>




    </div>



    <!-- Purchase Order Table -->
    <div class="row mt-2 text-center ">

        <div class="col-1"></div>
        <div class="col-10">

            <div class="card card-body"
                style="background-color: lavender; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.596);">
                <div class="row mt-2 mb-3">
                    <h5><i class="fa-solid fa-table"></i> <b>Delivery Table</b></h5>
                </div>
                <div class="row mt-2 mb-3">
                    <table class="table table-hover" id="deliveryTable">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Delivery No</th>
                                <th scope="col">Ivoice No</th>
                                <th scope="col">Customer Name</th>
                                <th scope="col">Delivery Date</th>
                                <th scope="col">Delivery Address</th>
                                <th scope="col">Delivery Status</th>
                                <th scope="col">Modify</th>

                            </tr>
                        </thead>
                        <tbody id="tablelDeliveryBody">



                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>


                        </tbody>
                    </table>

                </div>
            </div>



        </div>
        <div class="col-1"></div>









    </div>











    </div>

    <script src="/script/commonFunctions.js"></script>
    <script src="/uicontroller/delivery.js"></script>

</body>

</html>
