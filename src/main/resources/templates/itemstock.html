<!DOCTYPE html>
<html lang="en">


<!-- Requesting header area from common header page -> header.html using ThymeLeaf Function -->

<head th:replace="header :: headerFragment"></head>

<!-- This is a unique element in head area -->

<head>
  <!-- link external css file -->
  <link rel="stylesheet" href="/css/production.css">

</head>

<body>

  <!-- nav bar -->
  <nav th:replace="topnavbar :: topNavbarFragment"></nav>

  <div class="container-fluid">
    <div class="row mt-2 mb-3"></div>
    <div class="row mt-2 mb-5">
      <div class="col-3"></div>
      <div class=" col-6 text-center fw-bold title text-light" style="box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.901);">
        <h4><i class="fa-solid fa-hands-holding-circle"></i> Item Stock</h4>
      </div>
      <div class="col-3"></div>

    </div>



    <!-- model view/print -->
    <div class="modal" id="modalProductionView" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
      aria-labelledby="staticBackdropLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalProductionViewTitle">Print Production Table</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">

            <div class="card">
              <div class="card-body form-area">
                <table class="table table-hover table-striped" id="tableProductionView">

                  <tr>
                    <th>Production Date </th>
                    <td id="tdProductionDate"></td>
                  </tr>
                  <tr>
                    <th>Production Order No </th>
                    <td id="tdProductionOrderNo"></td>
                  </tr>
                  <tr>
                    <th>Item Name </th>
                    <td id="tdItemName"></td>
                  </tr>
                  <tr>
                    <th>Item Quantity </th>
                    <td id="tdItemQty"></td>
                  </tr>
                  <tr>
                    <th>Production Session</th>
                    <td id="tdProductionSession"></td>
                  </tr>




                </table>

              </div>
            </div>
          </div>

          <div class="modal-footer">

            <button type="button" class="btn btn-primary" onclick="printProductionRow()">Print</button>
          </div>
        </div>
      </div>
    </div>


  </div>


  <div class="row mt-2 text-center ">

    <div class="col-1"></div>
    <div class="col-10">

      <div class="card card-body" style="background-color: lavender; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.596);">
        <div class="row mt-2 mb-3">
          <h5><i class="fa-solid fa-table"></i> <b>Item Stock Table</b></h5>
        </div>
        <div class="row mt-2 mb-3">
          <table class="table table-hover" id="productionTable">
            <thead class="table-dark">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Production Date</th>
                <th scope="col">Production Order No</th>
                <th scope="col">Item Name</th>
                <th scope="col">Quantity</th>
                <th scope="col">Production Session</th>
                <th scope="col">Modify</th>

              </tr>
            </thead>
            <tbody id="tableProductionBody">

              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
              <td></td>


            </tbody>
          </table>

        </div>
      </div>



    </div>
    <div class="col-1"></div>









  </div>











  </div>




  <script src="/script/commonFunctions.js"></script>
  <script src="/uicontroller/itemstock.js"></script>

</body>

</html>
